name: 📝 New blog post
description: Write a post for the News page. No coding needed — just fill this in.
title: "[Post] "
labels: ["new-post"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and press **Submit new issue** at the bottom.

        Your post goes live on its own in a minute or two, and you'll get a comment here with the link. Nothing is public until it's published, so take your time.
  - type: input
    id: title
    attributes:
      label: Headline
      description: Shown on the news card, at the top of the post, and in Google results. Around 8–12 words works best.
      placeholder: Hulsey to Host Town Hall in Helena
    validations:
      required: true
  - type: input
    id: excerpt
    attributes:
      label: One-sentence summary
      description: Shown on the news card and when the post is shared on Facebook or in a text message. Write it as a full sentence.
      placeholder: Rep. Hulsey will hold an open town hall at Helena City Hall on September 27, with time for questions from residents.
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Post text
      description: |
        Write normally. A blank line starts a new paragraph. If you want a bit of formatting:
        `## A heading` on its own line · `- ` at the start of a line for a bullet · `**bold**` · `> ` for a quote · `[link text](https://example.com)`
      placeholder: |
        State Rep. Leigh Hulsey will host an open town hall for residents of House District 15 on Saturday, September 27.

        ## What to expect

        The meeting runs from 10:00 a.m. to noon at Helena City Hall.
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Photo (optional)
      description: |
        Drag a photo into this box, or click it and choose a file. It becomes the picture on the news card, at the top of the post, and the image people see when the post is shared.

        Landscape photos look best. A large file is fine.
  - type: input
    id: photo_alt
    attributes:
      label: What is happening in the photo? (optional)
      description: One short line. It shows as the caption, and it is what screen readers and search engines read.
      placeholder: Rep. Hulsey speaks with residents at Helena City Hall
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: This becomes a filter button on the News page.
      options:
        - Campaign
        - Legislation
        - District
        - Events
        - Statement
        - Press Release
        - In the News
        - Other
      default: 0
  - type: input
    id: category_other
    attributes:
      label: Other category (only if you picked Other)
      placeholder: Endorsements
  - type: input
    id: date
    attributes:
      label: Date (YYYY-MM-DD)
      description: Leave blank to use today's date. Posts show newest first.
      placeholder: 2026-09-14
  - type: checkboxes
    id: draft
    attributes:
      label: Save as a draft
      options:
        - label: Hold this back — save it but keep it off the website for now
